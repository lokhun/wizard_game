<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music Box</title>
  <style>
    body { margin: 0; padding: 18px; background: #0b0a0d; font-family: Georgia, serif; color: #d8c8a0; }
    h1 { font-weight: normal; letter-spacing: 0.08em; margin: 0 0 6px; }
    p { color: #9a8c70; margin: 0 0 14px; }
    .grp { margin: 14px 0 6px; color: #c0a060; text-transform: uppercase; font-size: 13px; letter-spacing: 0.12em; }
    button { background: #1a161c; color: #e8d8b0; border: 1px solid #4a3a2a; padding: 7px 12px; margin: 3px; font: inherit; cursor: pointer; border-radius: 3px; }
    button.on { background: #4a3218; border-color: #c08840; }
    #ctl { margin: 12px 0; }
  </style>
</head>
<body>
  <h1>Music Box</h1>
  <p>Every theme in the game. Boss themes grow with the fight: raise the intensity to hear their later phases.</p>
  <div id="ctl"></div>
  <div id="list"></div>
  <script type="module" src="/tools/music.js"></script>
</body>
</html>
