<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wizard Models</title>
  <style>
    html, body { margin: 0; height: 100%; background: #07080a; overflow: hidden; font-family: Georgia, serif; color: #d8c8a0; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; left: 12px; top: 10px; font-size: 13px; line-height: 1.45; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; }
    #cross { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; pointer-events: none; }
    #cross::before, #cross::after { content: ''; position: absolute; background: rgba(255,255,255,0.75); }
    #cross::before { left: 6px; top: 0; width: 2px; height: 14px; }
    #cross::after { top: 6px; left: 0; height: 2px; width: 14px; }
    .label { position: fixed; transform: translate(-50%, 0); font-size: 12px; color: #e8d8b0; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: nowrap; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <script type="module" src="/tools/wizards.js"></script>
</body>
</html>
