<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enemy Model Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #07080a; overflow: hidden; font: 12px/1.35 system-ui, sans-serif; color: #d8cfbf; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #ui { position: fixed; left: 8px; top: 8px; right: 8px; pointer-events: none; display: flex; flex-direction: column; gap: 4px; }
    #ui .row { display: flex; flex-wrap: wrap; gap: 3px; pointer-events: auto; }
    #ui button { background: rgba(20,18,16,.78); color: #d8cfbf; border: 1px solid #4a4036; padding: 2px 6px; font: inherit; cursor: pointer; border-radius: 3px; }
    #ui button.on { background: #6a4a1c; border-color: #c08a3a; color: #fff; }
    #info { position: fixed; left: 8px; bottom: 8px; background: rgba(10,10,10,.7); padding: 6px 8px; border-radius: 4px; white-space: pre; pointer-events: none; }
    #help { position: fixed; right: 8px; bottom: 8px; background: rgba(10,10,10,.6); padding: 6px 8px; border-radius: 4px; white-space: pre; color: #a89f90; }
    body.clean #ui, body.clean #help, body.clean #info { display: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <div id="info"></div>
  <div id="help">drag: orbit · wheel: zoom · ←/→ type · 1-8 anim · A attack variant
space: auto-cycle · G grid · S sheet · M muzzle marker · H hide UI
URL: ?type=skeleton&amp;anim=move&amp;attack=swing&amp;p=0.5&amp;speed=2&amp;sheet=1&amp;grid=1&amp;clean=1</div>
  <script type="module" src="/tools/models.js"></script>
</body>
</html>
