# coturn: a TURN relay for co-op players whose networks block direct WebRTC
# (symmetric NAT / CGNAT, phone hotspots, many school and work networks).
# Browsers still connect directly when they can; only the rest relay here
# (~8 KB/s per player). UDP only, on ports the Droplet's firewall already
# allows (40000-40100/udp); the lower half stays free for RIFT's own WebRTC.
#
# Logins are short-lived (TURN REST API): turn-credentials.mjs signs
# "<expiry>:arcane" with the shared secret, which tools/deploy.mjs generates
# on the server (/opt/wizard/turn.secret) and writes in place of the
# placeholder below. It never leaves the Droplet.
listening-ip=157.230.224.36
relay-ip=157.230.224.36
external-ip=157.230.224.36
listening-port=40050
min-port=40051
max-port=40100
no-tcp
no-tls
no-dtls
no-tcp-relay
realm=lokhunproject.fun
use-auth-secret
static-auth-secret=__TURN_SECRET__
fingerprint
no-cli
no-multicast-peers
no-software-attribute
# smaller replies to unauthenticated requests: nothing to amplify
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
# never relay into private, loopback or link-local space (the Droplet's own services)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
# bandwidth: 64 KB/s per session (a player needs ~8), 1 MB/s for the whole relay, 50 sessions
max-bps=64000
bps-capacity=1000000
total-quota=50
stale-nonce=600
log-file=stdout
simple-log
